{% extends "templates/pages/base.html" %}

{% block content %}
<div class="jk-container">
    <div class="jk-content-wrapper">
        <div class="jk-card">
            <div class="jk-card-header">
                <div class="jk-card-title-wrapper">
                    <h4 class="jk-card-title">Payment Settings</h4>
                    <p class="jk-card-subtitle">Configure your payment methods for payroll processing</p>
                </div>
            </div>
            <div class="jk-card-body">
                <!-- Payment Method Tabs -->
                <div class="jk-tabs">
                    <div class="jk-tab-header">
                        <button class="jk-tab-btn active" onclick="switchTab('bank')">Bank Transfer</button>
                        <button class="jk-tab-btn" onclick="switchTab('wave')">Wave</button>
                    </div>

                    <!-- Bank Transfer Tab -->
                    <div class="jk-tab-content active" id="bankTab">
                        <div class="jk-section">
                            <div class="jk-form-group">
                                <label class="jk-form-label jk-checkbox-label">
                                    <input type="checkbox" class="jk-checkbox" id="enableBankPayments" onchange="toggleBankSettings()">
                                    <span>Pay salaries with bank transfer</span>
                                </label>
                            </div>

                            <div id="bankSettings" class="jk-bank-settings" style="display: none;">
                                <div class="jk-section-header">
                                    <div class="jk-section-title-group">
                                        <h5 class="jk-section-title">
                                            <i class="fas fa-university jk-section-icon"></i>
                                            Bank Account Details
                                        </h5>
                                    </div>
                                </div>
                                
                                <form id="bankForm" action="/api/method/jokoor.api.payroll.set_bank_account" method="POST" class="jk-form">
                                    <div class="jk-form-group">
                                        <label class="jk-form-label" for="bankName">Bank Name</label>
                                        <input type="text" class="jk-form-control" id="bankName" name="bank_name" required>
                                    </div>

                                    <div class="jk-form-group">
                                        <label class="jk-form-label" for="accountNumber">Account Number</label>
                                        <input type="text" class="jk-form-control" id="accountNumber" name="account_number" required>
                                    </div>

                                    <div class="jk-form-group">
                                        <label class="jk-form-label" for="accountType">Account Type</label>
                                        <select class="jk-form-control" id="accountType" name="account_type" required>
                                            <option value="savings">Savings Account</option>
                                            <option value="checking">Checking Account</option>
                                            <option value="business">Business Account</option>
                                        </select>
                                    </div>

                                    <div class="jk-form-group">
                                        <label class="jk-form-label" for="routingNumber">Routing Number</label>
                                        <input type="text" class="jk-form-control" id="routingNumber" name="routing_number" required>
                                    </div>

                                    <div class="jk-form-group">
                                        <label class="jk-form-label" for="swiftCode">SWIFT Code</label>
                                        <input type="text" class="jk-form-control" id="swiftCode" name="swift_code">
                                        <small class="jk-form-help">Required for international transfers</small>
                                    </div>

                                    <div class="jk-form-actions">
                                        <button type="submit" class="jk-btn jk-btn-primary">
                                            <i class="fas fa-save"></i>
                                            Save Bank Details
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Wave Tab -->
                    <div class="jk-tab-content" id="waveTab">
                        <div class="jk-section">
                            <div class="jk-form-group">
                                <label class="jk-form-label jk-checkbox-label">
                                    <input type="checkbox" class="jk-checkbox" id="enableWavePayments" onchange="toggleWaveSettings()">
                                    <span>Pay salaries with Wave</span>
                                </label>
                            </div>

                            <div id="waveSettings" class="jk-wave-settings" style="display: none;">
                                <div class="jk-section-header">
                                    <div class="jk-section-title-group">
                                        <h5 class="jk-section-title">
                                            <i class="fas fa-wave-square jk-section-icon"></i>
                                            Wave Configuration
                                        </h5>
                                    </div>
                                </div>
                                
                                <div class="jk-form-group">
                                    <label class="jk-form-label">API Key</label>
                                    <div class="jk-input-group">
                                        <input type="password" class="jk-form-control" id="waveApiKey" placeholder="Enter Wave API Key">
                                        <button class="jk-btn jk-btn-secondary" onclick="toggleWaveApiKey()">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="jk-form-group">
                                    <label class="jk-form-label">Business ID</label>
                                    <input type="text" class="jk-form-control" id="waveBusinessId" placeholder="Enter Wave Business ID">
                                </div>

                                <div class="jk-form-actions">
                                    <button class="jk-btn jk-btn-primary" onclick="saveWaveSettings()">
                                        <i class="fas fa-save"></i>
                                        Save Wave Settings
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
// Tab switching
function switchTab(tab) {
    // Remove active class from all tabs
    document.querySelectorAll('.jk-tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.jk-tab-content').forEach(content => content.classList.remove('active'));
    
    // Add active class to selected tab
    document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
    document.getElementById(`${tab}Tab`).classList.add('active');
}

// Bank settings
function toggleBankSettings() {
    const checkbox = document.getElementById('enableBankPayments');
    const settings = document.getElementById('bankSettings');
    settings.style.display = checkbox.checked ? 'block' : 'none';
}

// Wave settings
function toggleWaveSettings() {
    const checkbox = document.getElementById('enableWavePayments');
    const settings = document.getElementById('waveSettings');
    settings.style.display = checkbox.checked ? 'block' : 'none';
}

function toggleWaveApiKey() {
    const apiKey = document.getElementById('waveApiKey');
    apiKey.type = apiKey.type === 'password' ? 'text' : 'password';
}

function saveWaveSettings() {
    const apiKey = document.getElementById('waveApiKey').value;
    const businessId = document.getElementById('waveBusinessId').value;
    
    fetch('/api/method/jokoor.api.payroll.set_wave_settings', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-Frappe-CSRF-Token': frappe.csrf_token
        },
        body: JSON.stringify({
            api_key: apiKey,
            business_id: businessId
        })
    })
    .then(response => response.json())
    .then(data => {
        frappe.show_alert({
            message: 'Wave settings saved successfully',
            indicator: 'green'
        });
    })
    .catch(error => {
        frappe.show_alert({
            message: 'Error saving Wave settings',
            indicator: 'red'
        });
    });
}

// Form submission
document.getElementById('bankForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = {};
    formData.forEach((value, key) => data[key] = value);

    fetch(this.action, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-Frappe-CSRF-Token': frappe.csrf_token
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(data => {
        frappe.show_alert({
            message: 'Bank details saved successfully',
            indicator: 'green'
        });
    })
    .catch(error => {
        frappe.show_alert({
            message: 'Error saving bank details',
            indicator: 'red'
        });
    });
});
</script>

<style>
/* Jokoor Design System Styles */
:root {
    --jk-primary: #5534c9;
    --jk-primary-hover: #4425a3;
    --jk-bg-light: #f9f7ff;
    --jk-border: #e8e9ec;
}

.jk-container {
    padding: 0;
    max-width: 100%;
    margin: 0;
}

.jk-content-wrapper {
    background: var(--bg-color);
    width: 100%;
}

.jk-card {
    background: #fff;
    border-bottom: 1px solid var(--jk-border);
}

.jk-card-header {
    padding: 1.5rem;
    border-bottom: 1px solid var(--jk-border);
    background: var(--jk-bg-light);
}

.jk-card-title {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-color);
    margin: 0;
}

.jk-card-subtitle {
    color: #64748b;
    font-size: 0.875rem;
    margin: 0.25rem 0 0 0;
}

.jk-card-body {
    padding: 1.5rem;
}

/* Sections */
.jk-section {
    margin-bottom: 2rem;
}

.jk-section:last-child {
    margin-bottom: 0;
}

.jk-section-header {
    margin-bottom: 1.5rem;
}

.jk-section-title {
    font-size: 1.125rem;
    font-weight: 600;
    color: var(--text-color);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.jk-section-icon {
    color: var(--jk-primary);
    font-size: 1.125rem;
}

/* Form */
.jk-form {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.jk-form-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.jk-form-label {
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-color);
}

.jk-form-control {
    padding: 0.625rem 0.875rem;
    border: 1px solid var(--jk-border);
    border-radius: 6px;
    font-size: 0.875rem;
    color: var(--text-color);
}

.jk-form-control:focus {
    outline: none;
    border-color: var(--jk-primary);
    box-shadow: 0 0 0 2px rgba(85, 52, 201, 0.1);
}

.jk-form-help {
    font-size: 0.75rem;
    color: #64748b;
}

/* Checkbox Styles */
.jk-checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
}

.jk-checkbox {
    width: 1rem;
    height: 1rem;
    border: 2px solid var(--jk-border);
    border-radius: 4px;
    cursor: pointer;
}

.jk-checkbox:checked {
    background-color: var(--jk-primary);
    border-color: var(--jk-primary);
}

/* Buttons */
.jk-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    font-weight: 500;
    border-radius: 0.375rem;
    cursor: pointer;
    transition: all 0.2s;
}

.jk-btn-primary {
    background-color: var(--jk-primary);
    color: white;
    border: none;
}

.jk-btn-primary:hover {
    background-color: var(--jk-primary-hover);
}

.jk-btn-secondary {
    background: #fff;
    border: 1px solid var(--jk-border);
    color: #64748b;
}

.jk-btn-secondary:hover {
    background: var(--jk-bg-light);
}

.jk-btn i {
    font-size: 0.875rem;
}

/* Form Actions */
.jk-form-actions {
    margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--jk-border);
}

/* Tab Styles */
.jk-tabs {
    margin-top: 1rem;
}

.jk-tab-header {
    display: flex;
    gap: 1rem;
    border-bottom: 1px solid var(--jk-border);
    margin-bottom: 1.5rem;
}

.jk-tab-btn {
    padding: 0.75rem 1.5rem;
    border: none;
    background: none;
    font-weight: 500;
    color: #64748b;
    cursor: pointer;
    position: relative;
}

.jk-tab-btn.active {
    color: var(--jk-primary);
}

.jk-tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--jk-primary);
}

.jk-tab-content {
    display: none;
}

.jk-tab-content.active {
    display: block;
}

/* Responsive Styles */
@media (max-width: 768px) {
    .jk-tab-header {
        flex-direction: column;
        gap: 0;
    }
    
    .jk-tab-btn {
        width: 100%;
        text-align: left;
    }
}
</style>
{% endblock %}

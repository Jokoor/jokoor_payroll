{% set page_title = "New Inventory Item" %}
{% set content %}
<div class="container-fluid p-4">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/restaurant">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/restaurant/inventory">Inventory</a></li>
            <li class="breadcrumb-item active">New Item</li>
        </ol>
    </nav>

    <!-- Form -->
    {% include "jokoor_payroll/templates/includes/elements/form.html" %}
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('{{ form_id }}');
    const quantityInput = form.querySelector('[name="quantity"]');
    const unitPriceInput = form.querySelector('[name="unit_price"]');
    const totalValueInput = form.querySelector('[name="total_value"]');

    // Calculate total value when quantity or unit price changes
    function calculateTotalValue() {
        const quantity = parseFloat(quantityInput.value) || 0;
        const unitPrice = parseFloat(unitPriceInput.value) || 0;
        const totalValue = quantity * unitPrice;
        totalValueInput.value = totalValue.toFixed(2);
    }

    quantityInput.addEventListener('input', calculateTotalValue);
    unitPriceInput.addEventListener('input', calculateTotalValue);

    // Generate item code when form loads
    const itemCodeInput = form.querySelector('[name="item_code"]');
    if (!itemCodeInput.value) {
        const timestamp = new Date().getTime().toString().slice(-4);
        itemCodeInput.value = `ING-${timestamp}`;
    }

    // Add cancel button
    const formActions = form.querySelector('.form-actions');
    if (formActions) {
        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn btn-light me-2';
        cancelBtn.textContent = 'Cancel';
        cancelBtn.onclick = () => window.location.href = '/restaurant/inventory';
        
        const submitBtn = formActions.querySelector('button[type="submit"]');
        if (submitBtn) {
            formActions.insertBefore(cancelBtn, submitBtn);
        }
    }
});
</script>
{% endset %}
{% include "jokoor_payroll/templates/pages/restaurant_page.html" %}

{% block style %}
<style>
    :root {
        --brand-purple: #5534c9;
        --brand-purple-50: #f6f4fe;
        --brand-purple-100: #ede9fd;
        --brand-purple-600: #5534c9;
        --brand-purple-700: #4c2eb3;
        --brand-purple-800: #42289c;
    }

    /* Sidebar container */
    .jk-sidebar-restaurant {
        width: 240px;
        height: 100vh;
        background: #1e1f2d;
        color: #94a3b8;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1001;
        display: flex;
        flex-direction: column;
        font-family: system-ui, -apple-system, sans-serif;
        transition: all 0.3s ease;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Navigation */
    .jk-sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 0.75rem;
    }

    .jk-sidebar-nav::-webkit-scrollbar {
        width: 4px;
    }

    .jk-sidebar-nav::-webkit-scrollbar-track {
        background: transparent;
    }

    .jk-sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
    }

    .jk-nav-section {
        margin-bottom: 1.5rem;
    }

    .jk-nav-section:last-child {
        margin-bottom: 0.5rem;
    }

    .jk-nav-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 0.75rem;
        border-radius: 0.375rem;
        color: #94a3b8;
        text-decoration: none;
        transition: all 0.2s ease;
        font-size: 0.875rem;
        font-weight: 500;
        position: relative;
        margin: 0.125rem 0;
    }

    .jk-nav-item:hover {
        background: rgba(255, 255, 255, 0.05);
        color: white;
    }

    .jk-nav-item.active {
        background: #5534c9;
        color: white;
    }

    .jk-nav-item i {
        font-size: 1.125rem;
        width: 1.5rem;
        text-align: center;
    }

    .jk-nav-item .jk-nav-arrow {
        margin-left: auto;
        opacity: 0.5;
        font-size: 0.75rem;
    }

    .jk-nav-item.dashboard {
        background: #5534c9;
        color: white;
        margin-bottom: 0.5rem;
    }

    .jk-nav-item.dashboard:hover {
        background: #4c2eb3;
    }

    /* User profile section */
    .jk-user-profile {
        padding: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .jk-user-avatar {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 50%;
        background: #2e2f3e;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
    }

    .jk-user-info {
        flex: 1;
        min-width: 0;
    }

    .jk-user-name {
        color: white;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.25rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .jk-user-role {
        color: #64748b;
        font-size: 0.75rem;
    }

    .jk-user-notifications {
        color: #94a3b8;
        cursor: pointer;
        padding: 0.5rem;
        margin: -0.5rem;
        border-radius: 0.375rem;
        transition: all 0.2s ease;
    }

    .jk-user-notifications:hover {
        color: white;
        background: rgba(255, 255, 255, 0.05);
    }

    /* Mobile styles */
    @media (max-width: 768px) {
        .jk-sidebar-restaurant {
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .jk-sidebar-restaurant.show {
            transform: translateX(0);
        }
    }

    /* Mobile toggle button */
    .jk-sidebar-toggle {
        display: none;
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 1002;
        background: #1e1f2d;
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 40px;
        height: 40px;
        border-radius: 0.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        color: #94a3b8;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 1.25rem;
        align-items: center;
        justify-content: center;
    }

    .jk-sidebar-toggle:hover {
        background: #5534c9;
        color: white;
        border-color: rgba(37, 99, 235, 0.1);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
    }

    @media (max-width: 1024px) {
        .jk-sidebar-toggle {
            display: flex;
        }
    }

    /* Overlay */
    .jk-sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.3);
        backdrop-filter: blur(2px);
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .jk-sidebar-overlay.show {
        display: block;
        opacity: 1;
    }
</style>
{% endblock %}

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Overlay for mobile -->
<div class="jk-sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<aside class="jk-sidebar-restaurant">
    <div class="jk-sidebar-header">
        <div class="jk-sidebar-title" style="font-size: 1.375rem; font-weight: 600; color: white; letter-spacing: -0.025em; padding: 1rem 0.75rem;">
            Restaurants
        </div>
    </div>
    
    <nav class="jk-sidebar-nav">
        <!-- Main Navigation -->
        <div class="jk-nav-section">
            <a href="/restaurant" class="jk-nav-item dashboard {% if active_page == 'dashboard' %}active{% endif %}">
                <i class="fas fa-chart-line"></i>
                Dashboard
            </a>
            
            <a href="/restaurant/orders" class="jk-nav-item {% if active_page == 'orders' %}active{% endif %}">
                <i class="fas fa-shopping-cart"></i>
                Orders
            </a>

            <a href="/restaurant/kitchen" class="jk-nav-item {% if active_page == 'kitchen' %}active{% endif %}">
                <i class="fas fa-utensils"></i>
                Kitchen Order Tickets
            </a>

            <a href="/restaurant/reservation" class="jk-nav-item {% if active_page == 'reservation' %}active{% endif %}">
                <i class="fas fa-calendar-alt"></i>
                Reservation
            </a>

            <a href="/restaurant/satisfaction" class="jk-nav-item {% if active_page == 'satisfaction' %}active{% endif %}">
                <i class="fas fa-smile"></i>
                Customer Satisfaction
            </a>

            <a href="/restaurant/menus" class="jk-nav-item {% if active_page == 'menus' %}active{% endif %}">
                <i class="fas fa-book-open"></i>
                Menus
            </a>

            <a href="/restaurant/suppliers" class="jk-nav-item {% if active_page == 'suppliers' %}active{% endif %}">
                <i class="fas fa-truck"></i>
                Suppliers
            </a>

            <a href="/restaurant/inventory" class="jk-nav-item {% if active_page == 'inventory' %}active{% endif %}">
                <i class="fas fa-box"></i>
                Inventory
            </a>

            <a href="/restaurant/settings" class="jk-nav-item {% if active_page == 'settings' %}active{% endif %}">
                <i class="fas fa-cog"></i>
                Settings
            </a>
        </div>
    </nav>

    <!-- User Profile Section -->
    <div class="jk-user-profile">
        <div class="jk-user-avatar">
            <i class="fas fa-user"></i>
        </div>
        <div class="jk-user-info">
            <div class="jk-user-name">{{ frappe.session.user_fullname or frappe.session.user }}</div>
            <div class="jk-user-role">Restaurant Manager</div>
        </div>
        <div class="jk-user-notifications">
            <i class="fas fa-bell"></i>
        </div>
    </div>
</aside>

<!-- Mobile toggle button -->
<button class="jk-sidebar-toggle" id="sidebarToggle" aria-label="Toggle Menu">
    <i class="fas fa-bars"></i>
</button>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.querySelector('.jk-sidebar-restaurant');
    const overlay = document.getElementById('sidebarOverlay');
    const toggleBtn = document.getElementById('sidebarToggle');
    
    // Toggle sidebar function
    function toggleSidebar() {
        sidebar.classList.toggle('show');
        overlay.classList.toggle('show');
        document.body.style.overflow = sidebar.classList.contains('show') ? 'hidden' : '';
    }

    // Add click events
    toggleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleSidebar();
    });

    overlay.addEventListener('click', toggleSidebar);

    // Close sidebar when clicking outside
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 1024 && 
            sidebar.classList.contains('show') && 
            !sidebar.contains(e.target) && 
            !toggleBtn.contains(e.target)) {
            toggleSidebar();
        }
    });

    // Handle window resize
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (window.innerWidth > 1024) {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }, 250);
    });
});</script>

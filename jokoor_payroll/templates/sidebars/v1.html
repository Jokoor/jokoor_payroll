<style>
    :root {
        --jk-sidebar-width: 250px;
        --jk-header-height: var(--header-height, 60px);
        --jk-primary-color: #5534c9;
        --jk-text-color: #344054;
        --jk-text-muted: #667085;
        --jk-bg-hover: #f9fafb;
        --jk-bg-active: #f5f3ff;
        --jk-active-color: var(--jk-primary-color);
        --jk-border-color: #eaecf0;
    }

    .jk-sidebar-v1 {
        width: var(--jk-sidebar-width);
        background: #ffffff;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1000;
        box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
        display: flex;
        flex-direction: column;
    }

    .jk-sidebar-v1 .jk-sidebar-header {
        height: var(--jk-header-height);
        background: #f8f9fa;
        border-bottom: 1px solid #e9ecef;
        display: flex;
        align-items: center;
        padding: 0 1.25rem;
    }

    .jk-sidebar-v1 .jk-sidebar-header img {
        height: calc(var(--jk-header-height) * 0.5);
        width: auto;
        object-fit: contain;
    }

    .jk-sidebar-v1 .jk-sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 0;
    }

    .jk-sidebar-v1 .jk-nav-item {
        position: relative;
        margin: 0.125rem 0.75rem;
    }

    .jk-sidebar-v1 .jk-nav-link {
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        color: var(--jk-text-color);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 500;
        transition: all 0.2s ease;
        border-radius: 8px;
    }

    .jk-sidebar-v1 .jk-nav-link:hover {
        color: var(--jk-primary-color);
        background: var(--jk-bg-hover);
    }

    .jk-sidebar-v1 .jk-nav-link.active {
        color: var(--jk-primary-color);
        background: var(--jk-bg-active);
    }

    .jk-sidebar-v1 .jk-nav-link i {
        width: 20px;
        margin-right: 12px;
        font-size: 1rem;
        color: inherit;
        text-align: center;
    }

    .jk-sidebar-v1 .jk-nav-text {
        flex: 1;
    }

    .jk-sidebar-v1 .jk-nav-arrow {
        font-size: 0.75rem;
        color: inherit;
        opacity: 0.7;
        transition: transform 0.2s ease;
    }

    .jk-sidebar-v1 .jk-nav-item.active > .jk-nav-link .jk-nav-arrow {
        transform: rotate(180deg);
    }

    .jk-sidebar-v1 .jk-nav-submenu {
        display: none;
        margin-top: 0.25rem;
    }

    .jk-sidebar-v1 .jk-nav-item.active > .jk-nav-submenu {
        display: block;
    }

    .jk-sidebar-v1 .jk-nav-submenu .jk-nav-link {
        padding: 0.625rem 1rem 0.625rem 2.75rem;
        color: var(--jk-text-muted);
        font-size: 0.8125rem;
        font-weight: 400;
    }

    .jk-sidebar-v1 .jk-nav-submenu .jk-nav-link:hover {
        color: var(--jk-primary-color);
        background: var(--jk-bg-hover);
    }

    .jk-sidebar-v1 .jk-nav-submenu .jk-nav-link.active {
        color: var(--jk-primary-color);
        background: var(--jk-bg-active);
    }

    /* Scrollbar */
    .jk-sidebar-v1 .jk-sidebar-nav::-webkit-scrollbar {
        width: 6px;
    }

    .jk-sidebar-v1 .jk-sidebar-nav::-webkit-scrollbar-track {
        background: transparent;
    }

    .jk-sidebar-v1 .jk-sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(108, 117, 125, 0.2);
        border-radius: 3px;
    }

    .jk-sidebar-v1 .jk-sidebar-nav::-webkit-scrollbar-thumb:hover {
        background: rgba(108, 117, 125, 0.3);
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const menuItems = document.querySelectorAll('.jk-sidebar-v1 .jk-nav-item > .jk-nav-link');
    
    menuItems.forEach(item => {
        if (item.nextElementSibling && item.nextElementSibling.classList.contains('jk-nav-submenu')) {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const parent = this.parentElement;
                parent.classList.toggle('active');
            });
        }
    });
});
</script>

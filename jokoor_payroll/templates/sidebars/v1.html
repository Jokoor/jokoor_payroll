<style>
    .sidebar {
        width: 250px;
        background: #2b3245;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1000;
    }

    .sidebar-header {
        padding: 1.25rem;
        background: #2b3245;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-header img {
        height: 30px;
        width: auto;
        filter: brightness(0) invert(1);
    }

    .sidebar-nav {
        padding: 0.5rem 0;
        overflow-y: auto;
        height: calc(100vh - 70px);
    }

    .nav-item {
        position: relative;
    }

    .nav-link {
        display: flex;
        align-items: center;
        padding: 0.75rem 1.25rem;
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 400;
        transition: all 0.2s ease;
        border-left: 3px solid transparent;
    }

    .nav-link:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.05);
    }

    .nav-link.active {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.1);
        border-left: 3px solid #4a90e2;
    }

    .nav-link i {
        width: 20px;
        margin-right: 12px;
        font-size: 1rem;
        color: inherit;
        text-align: center;
    }

    .nav-text {
        flex: 1;
    }

    .nav-arrow {
        font-size: 0.75rem;
        color: inherit;
        opacity: 0.7;
        transition: transform 0.2s ease;
    }

    .nav-item.active > .nav-link .nav-arrow {
        transform: rotate(180deg);
    }

    .nav-submenu {
        display: none;
        background: #242837;
    }

    .nav-item.active > .nav-submenu {
        display: block;
    }

    .nav-submenu .nav-link {
        padding: 0.625rem 1rem 0.625rem 3.25rem;
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.8125rem;
    }

    .nav-submenu .nav-link:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.05);
    }

    .nav-submenu .nav-link.active {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.1);
    }

    /* Scrollbar */
    .sidebar-nav::-webkit-scrollbar {
        width: 6px;
    }

    .sidebar-nav::-webkit-scrollbar-track {
        background: transparent;
    }

    .sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
    }

    .sidebar-nav::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const menuItems = document.querySelectorAll('.nav-item > .nav-link');
    
    menuItems.forEach(item => {
        item.addEventListener('click', function(e) {
            const parent = this.parentElement;
            if (parent.querySelector('.nav-submenu')) {
                e.preventDefault();
                e.stopPropagation();
                
                const wasActive = parent.classList.contains('active');
                
                // Close all menus
                document.querySelectorAll('.nav-item.active').forEach(menu => {
                    menu.classList.remove('active');
                });
                
                // Toggle current menu
                if (!wasActive) {
                    parent.classList.add('active');
                }
            }
        });
    });

    // Close menus when clicking outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.nav-item')) {
            document.querySelectorAll('.nav-item.active').forEach(menu => {
                menu.classList.remove('active');
            });
        }
    });
});
</script>

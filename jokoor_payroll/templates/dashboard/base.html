<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title|default('Dashboard') }} - Jokoor</title>
    <!-- Carbon Design System CSS -->
    <link rel="stylesheet" href="https://unpkg.com/carbon-components/css/carbon-components.min.css">
    <style>
        :root {
            --primary-color: #6929c4;
            --primary-light: #8a3ffc;
            --primary-dark: #491d8b;
        }
        
        body {
            background-color: #f4f4f4;
            font-family: 'IBM Plex Sans', sans-serif;
            margin: 0;
            padding: 0;
            font-size: 16px;
        }
        
        .jk-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            background-color: white;
        }
        
        .jk-sidebar {
            width: 250px;
            background-color: white;
            border-right: 1px solid #e0e0e0;
            padding: 1.5rem 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }
        
        .jk-sidebar-header {
            padding: 0 1.5rem 1.5rem;
            margin-bottom: 1rem;
        }
        
        .jk-sidebar-section {
            margin-bottom: 1.5rem;
        }
        
        .jk-sidebar-section-title {
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            color: #525252;
            font-size: 1rem;
            text-transform: uppercase;
        }
        
        .jk-sidebar-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            color: #525252;
            text-decoration: none;
            transition: background-color 0.2s;
            font-size: 1.1rem;
        }
        
        .jk-sidebar-link:hover {
            background-color: #f4f4f4;
        }
        
        .jk-sidebar-link.active {
            background-color: #edf5ff;
            color: var(--primary-color);
            border-left: 3px solid var(--primary-color);
        }
        
        .jk-sidebar-link svg {
            margin-right: 0.875rem;
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        
        .jk-content {
            flex: 1;
            padding: 2rem;
            margin-left: 250px;
            width: calc(100% - 250px);
        }
        
        .jk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .jk-header-title {
            font-size: 2rem;
            font-weight: 400;
            color: #161616;
        }
        
        .jk-header-actions {
            display: flex;
            align-items: center;
        }
        
        .jk-card {
            margin-bottom: 2rem;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }
        
        .jk-card-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .jk-card-title {
            font-size: 1.25rem;
            font-weight: 400;
            color: #161616;
            margin: 0;
        }
        
        .jk-card-body {
            padding: 1.5rem;
        }
        
        .jk-form-group {
            margin-bottom: 1.5rem;
        }
        
        .jk-form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
            font-weight: 400;
            color: #525252;
        }
        
        .jk-form-control {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 1.1rem;
            line-height: 1.5;
            color: #161616;
            background-color: #ffffff;
            background-clip: padding-box;
            border: 1px solid #a8a8a8;
            border-radius: 0;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        
        .jk-form-control:focus {
            color: #161616;
            background-color: #ffffff;
            border-color: var(--primary-color);
            outline: 0;
            box-shadow: 0 0 0 3px rgba(105, 41, 196, 0.25);
        }
        
        .jk-form-hint {
            margin-top: 0.25rem;
            font-size: 0.875rem;
            color: #6f6f6f;
        }
        
        .jk-form-error {
            margin-top: 0.25rem;
            font-size: 0.875rem;
            color: #da1e28;
            display: none;
        }
        
        .jk-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            padding: 0.75rem 1.25rem;
            font-size: 1.1rem;
            font-weight: 400;
            border-radius: 0;
            cursor: pointer;
            text-decoration: none;
        }
        
        .jk-btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        
        .jk-btn-primary:hover {
            background-color: var(--primary-dark);
        }
        
        .jk-btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }
        
        .jk-btn-secondary:hover {
            background-color: #f4f4f4;
        }
        
        .jk-btn svg {
            margin-right: 0.5rem;
        }
        
        .jk-dropdown {
            position: relative;
            display: inline-block;
        }
        
        .jk-dropdown-button {
            display: flex;
            align-items: center;
            background: none;
            border: none;
            padding: 0.5rem;
            font-size: 1.1rem;
            font-weight: 400;
            color: #161616;
            cursor: pointer;
        }
        
        .jk-dropdown-button svg {
            margin-left: 0.5rem;
        }
        
        .jk-dropdown-menu {
            position: absolute;
            right: 0;
            top: 100%;
            min-width: 160px;
            background-color: white;
            border: 1px solid #e0e0e0;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: none;
        }
        
        .jk-dropdown-menu.active {
            display: block;
        }
        
        .jk-dropdown-item {
            padding: 0.75rem 1rem;
            color: #525252;
            text-decoration: none;
            display: block;
            font-size: 1.1rem;
        }
        
        .jk-dropdown-item:hover {
            background-color: #f4f4f4;
        }
        
        .jk-description {
            color: #6f6f6f;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="jk-container">
        {% include 'templates/dashboard/sidebar.html' %}
        
        <div class="jk-content">
            {% include 'templates/dashboard/header.html' %}
            
            {% block content %}
            <!-- Page content will go here -->
            {% endblock %}
        </div>
    </div>

    <!-- Carbon Design System JavaScript -->
    <script src="https://unpkg.com/carbon-components/scripts/carbon-components.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Handle organization dropdown
            const dropdownButton = document.getElementById('org-dropdown-button');
            const dropdownMenu = document.getElementById('org-dropdown-menu');
            
            dropdownButton.addEventListener('click', function() {
                dropdownMenu.classList.toggle('active');
            });
            
            // Close dropdown when clicking outside
            window.addEventListener('click', function(event) {
                if (!event.target.matches('.jk-dropdown-button') && 
                    !event.target.closest('.jk-dropdown-button')) {
                    dropdownMenu.classList.remove('active');
                }
            });
            
            // Call any page-specific initialization
            if (typeof initPage === 'function') {
                initPage();
            }
        });
    </script>
    
    {% block extra_js %}
    <!-- Page-specific JavaScript will go here -->
    {% endblock %}
</body>
</html>

<div class="employee-card">
    <div class="employee-header">
        <h3>{{ employee.name }}</h3>
        <span class="employee-id">ID: {{ employee.employee_id }}</span>
    </div>
    
    <div class="employee-details">
        <div class="detail-row">
            <label>Position:</label>
            <span>{{ employee.designation }}</span>
        </div>
        
        <div class="detail-row">
            <label>Department:</label>
            <span>{{ employee.department }}</span>
        </div>
        
        <div class="detail-row">
            <label>Email:</label>
            <span>{{ employee.email }}</span>
        </div>
        
        <div class="detail-row">
            <label>Phone:</label>
            <span>{{ employee.phone }}</span>
        </div>
        
        <div class="detail-row">
            <label>Status:</label>
            <span class="status-badge status-{{ employee.status.lower() }}">
                {{ employee.status }}
            </span>
        </div>
    </div>
    
    <div class="employee-actions">
        <button class="btn btn-primary" onclick="editEmployee('{{ employee.employee_id }}')">
            Edit Employee
        </button>
        <button class="btn btn-secondary" onclick="viewDetails('{{ employee.employee_id }}')">
            View Details
        </button>
    </div>
</div>

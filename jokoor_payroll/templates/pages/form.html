{% extends "jokoor_payroll/templates/pages/base.html" %}

{% block content %}

<style>
    /* IBM Design System - Form Page */
    .form-container { 
        background: white; 
        border-radius: var(--ibm-border-radius-md);
        box-shadow: var(--ibm-shadow-sm);
        border: 1px solid var(--ibm-gray-20);
        overflow: hidden; 
        max-width: 100%;
        margin: 0 auto;
        font-family: var(--ibm-font-family);
    }
    
    .form-header { 
        padding: var(--ibm-spacing-06) var(--ibm-spacing-07); 
        border-bottom: 1px solid var(--ibm-gray-20); 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        background: var(--ibm-gray-10);
    }
    
    .form-title { 
        font-size: var(--ibm-font-size-2xl);
        font-weight: 600; 
        color: var(--ibm-gray-100); 
        margin: 0; 
        font-family: var(--ibm-font-family);
    }
    
    .header-actions { 
        display: flex; 
        gap: var(--ibm-spacing-04); 
    }
    
    /* Button Styling - IBM Design System (matching list.html) */
    .btn { 
        display: inline-flex;
        align-items: center;
        gap: var(--ibm-spacing-03);
        padding: var(--ibm-spacing-04) var(--ibm-spacing-05);
        font-size: var(--ibm-font-size-sm);
        font-weight: 600;
        border: 1px solid transparent;
        border-radius: var(--ibm-border-radius-md);
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.2, 0, 0.38, 0.9);
        text-decoration: none;
        line-height: 1;
        font-family: var(--ibm-font-family);
        position: relative;
        overflow: hidden;
    }

    .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s ease;
    }

    .btn:hover::before {
        left: 100%;
    }
    
    .btn-primary { 
        background: var(--brand-purple);
        color: white; 
        border-color: var(--brand-purple);
        box-shadow: var(--ibm-shadow-sm);
    }
    
    .btn-primary:hover { 
        background: var(--brand-purple-700);
        border-color: var(--brand-purple-700);
        transform: translateY(-1px);
        box-shadow: var(--ibm-shadow-md);
    }

    .btn-primary:active {
        background: var(--brand-purple-800);
        border-color: var(--brand-purple-800);
        transform: translateY(0);
        box-shadow: var(--ibm-shadow-sm);
    }

    .btn-primary:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(85, 52, 201, 0.3);
    }
    
    .btn-secondary { 
        background: white; 
        color: var(--ibm-gray-70); 
        border: 1px solid var(--ibm-gray-30); 
    }
    
    .btn-secondary:hover { 
        background: var(--ibm-gray-10); 
        border-color: var(--ibm-gray-50);
        color: var(--ibm-gray-100);
        transform: translateY(-1px);
        box-shadow: var(--ibm-shadow-sm);
    }

    .btn-secondary:active {
        background: var(--ibm-gray-20);
        border-color: var(--ibm-gray-60);
        transform: translateY(0);
    }

    .btn-secondary:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(107, 114, 128, 0.2);
    }
    
    .form-content { 
        height: 100vh; 
        min-height: 600px; 
        position: relative;
    }

    /* Form Layout - 2 columns (Image: 2, Form: 10) */
    .form-layout {
        display: flex;
        height: 100%;
        gap: var(--ibm-spacing-06);
    }

    /* Image Section (2 columns) */
    .form-image-section {
        flex: 0 0 16.666%; /* 2/12 = 16.666% */
        max-width: 200px;
        padding: var(--ibm-spacing-06);
        background: var(--ibm-gray-10);
        border-right: 1px solid var(--ibm-gray-20);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
    }

    /* Hide image section in edit mode */
    .form-layout.edit-mode .form-image-section {
        display: none !important;
    }

    /* Hide image section on mobile by default */
    @media (max-width: 768px) {
        .form-image-section {
            display: none !important;
        }
    }

    .image-container {
        width: 100%;
        max-width: 180px;
        aspect-ratio: 1;
        border-radius: var(--ibm-border-radius-md);
        overflow: hidden;
        background: white;
        border: 1px solid var(--ibm-gray-20);
        box-shadow: var(--ibm-shadow-sm);
    }

    .image-placeholder {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--ibm-gray-50);
        background: var(--ibm-gray-10);
        text-align: center;
        padding: var(--ibm-spacing-04);
    }

    .image-placeholder i {
        font-size: 2rem;
        margin-bottom: var(--ibm-spacing-03);
        opacity: 0.6;
    }

    .image-placeholder p {
        font-size: var(--ibm-font-size-xs);
        margin: 0;
        font-family: var(--ibm-font-family);
        color: var(--ibm-gray-60);
    }

    #formImage {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* Form Section (10 columns) */
    .form-iframe-section {
        flex: 1;
        min-width: 0; /* Allow flex item to shrink below content size */
    }
    
    .iframe-container { 
        width: 100%; 
        height: 100%; 
        position: relative;
    }

    .iframe-container iframe { 
        width: 100%; 
        height: 100%; 
        border: none; 
        display: block;
    }
    
    .loading-indicator { 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        height: 100%; 
        color: var(--ibm-gray-60); 
        font-size: var(--ibm-font-size-md); 
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        z-index: 10;
        font-family: var(--ibm-font-family);
    }
    
    .loading-spinner { 
        width: 24px; 
        height: 24px; 
        border: 3px solid var(--ibm-gray-20); 
        border-top: 3px solid var(--brand-purple); 
        border-radius: 50%; 
        animation: spin 1s linear infinite; 
        margin-right: var(--ibm-spacing-04); 
    }
    
    @keyframes spin { 
        0% { transform: rotate(0deg); } 
        100% { transform: rotate(360deg); } 
    }
    
    .back-link:hover {
        text-decoration: underline;
    }
    
    /* Mobile responsive - IBM Design System */
    @media (max-width: 768px) {
        .form-header {
            padding: var(--ibm-spacing-05) var(--ibm-spacing-06);
            flex-direction: column;
            gap: var(--ibm-spacing-05);
            align-items: flex-start;
        }
        
        .header-actions {
            width: 100%;
            justify-content: flex-end;
        }

        .form-title {
            font-size: var(--ibm-font-size-xl);
        }

        .btn {
            padding: var(--ibm-spacing-03) var(--ibm-spacing-04);
            font-size: var(--ibm-font-size-sm);
        }
        
        .form-content {
            height: 100vh;
        }

        /* Mobile layout - stack vertically */
        .form-layout {
            flex-direction: column;
            gap: var(--ibm-spacing-04);
        }

        .form-iframe-section {
            flex: 1;
            min-height: 0;
        }
    }

    @media (max-width: 480px) {
        .form-header {
            padding: var(--ibm-spacing-04) var(--ibm-spacing-05);
            gap: var(--ibm-spacing-04);
        }

        .form-title {
            font-size: var(--ibm-font-size-lg);
        }

        .btn {
            padding: var(--ibm-spacing-03) var(--ibm-spacing-04);
            font-size: var(--ibm-font-size-xs);
        }

        .header-actions {
            gap: var(--ibm-spacing-03);
        }
    }
</style>

    
    
    <div class="form-container">
        <div class="form-header">
            <h2 class="form-title">{{ title }}</h2>
            <div class="header-actions">
                {% if is_editable %}
                <button class="btn btn-primary" onclick="loadEditForm()" id="editBtn">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
                    </svg>
                    Edit {{ title }}
                </button>
                {% endif %}
                <button class="btn btn-secondary" onclick="loadViewForm()" id="viewBtn" style="display: none;">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/>
                        <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/>
                    </svg>
                    View Details
                </button>
            </div>
        </div>
        
        <div class="form-content">
            <div class="form-layout">
                <!-- Image Section (2 columns) - Only show if image is provided -->
                {% if image %}
                <div class="form-image-section">
                    <div class="image-container">
                        <div class="image-placeholder" id="imagePlaceholder" style="display: none;">
                            <i class="fas fa-image"></i>
                            <p>No image available</p>
                        </div>
                        <img src="{{ image }}" alt="{{ title }} Image" id="formImage" onerror="this.style.display='none'; document.getElementById('imagePlaceholder').style.display='flex';">
                    </div>
                </div>
                {% endif %}
                
                <!-- Form Section (10 columns) -->
                <div class="form-iframe-section">
                    <div class="iframe-container">
                        <div class="loading-indicator" id="loadingIndicator">
                            <div class="loading-spinner"></div>
                            Loading {{ title }} details...
                        </div>
                        <iframe src="http://localhost:4011/{{ url }}" id="employeeForm" onload="hideLoading()"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    let currentMode = 'view'; // 'view' or 'edit'
    const id = '{{ id }}';
    
    // Image handling functions
    function setFormImage(imageUrl) {
        const imageElement = document.getElementById('formImage');
        const placeholder = document.getElementById('imagePlaceholder');
        
        if (imageElement && placeholder) {
            if (imageUrl && imageUrl.trim() !== '') {
                imageElement.src = imageUrl;
                imageElement.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                imageElement.style.display = 'none';
                placeholder.style.display = 'flex';
            }
        }
    }

    function updateImageFromForm() {
        // Only try to update image if image section exists (image was provided via Jinja)
        const imageSection = document.querySelector('.form-image-section');
        if (!imageSection) return;
        
        // This function can be called to update the image based on form data
        // For now, we'll try to get the image from common form fields
        try {
            const iframe = document.getElementById('employeeForm');
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            // Look for common image fields
            const imageFields = [
                'input[name="image"]',
                'input[name="photo"]',
                'input[name="avatar"]',
                'input[name="profile_image"]',
                'input[name="picture"]',
                'img[src*="image"]',
                'img[src*="photo"]',
                'img[src*="avatar"]'
            ];
            
            for (let selector of imageFields) {
                const element = iframeDoc.querySelector(selector);
                if (element) {
                    const imageUrl = element.src || element.value;
                    if (imageUrl) {
                        setFormImage(imageUrl);
                        return;
                    }
                }
            }
            
            // If no image found, show placeholder
            setFormImage('');
        } catch (error) {
            console.log('Could not access iframe content:', error);
            setFormImage('');
        }
    }
    
    function hideLoading() {
        const loadingIndicator = document.getElementById('loadingIndicator');
        if (loadingIndicator) {
            loadingIndicator.style.display = 'none';
        }
        
        // Don't try to update image from iframe if image was provided via Jinja
        // The image is already set in the HTML template
    }
    
    function showLoading() {
        const loadingIndicator = document.getElementById('loadingIndicator');
        if (loadingIndicator) {
            loadingIndicator.style.display = 'flex';
            loadingIndicator.innerHTML = '<div class="loading-spinner"></div>Loading...';
        }
    }
    
    function loadEditForm() {
        if (currentMode === 'edit') return;
        
        currentMode = 'edit';
        showLoading();
        
        // Add edit-mode class to hide image section
        document.querySelector('.form-layout').classList.add('edit-mode');
        
        // Update iframe source to edit mode
        const iframe = document.getElementById('employeeForm');
        iframe.src = `http://localhost:4011/{{ url }}/edit`;
        
        // Update button states
        document.getElementById('editBtn').style.display = 'none';
        document.getElementById('viewBtn').style.display = 'inline-flex';
        
        // Update title
        document.querySelector('.form-title').textContent = 'Edit {{ title }}';
        
        // Listen for form submission from iframe
        window.addEventListener('message', handleFormSubmission);
    }
    
    function loadViewForm() {
        if (currentMode === 'view') return;
        
        currentMode = 'view';
        showLoading();
        
        // Remove edit-mode class to show image section
        document.querySelector('.form-layout').classList.remove('edit-mode');
        
        // Update iframe source to view mode
        const iframe = document.getElementById('employeeForm');
        iframe.src = `http://localhost:4011/{{ url }}`;
        
        // Update button states
        document.getElementById('editBtn').style.display = 'inline-flex';
        document.getElementById('viewBtn').style.display = 'none';
        
        // Update title
        document.querySelector('.form-title').textContent = '{{ title }} Details';
        
        // Remove form submission listener
        window.removeEventListener('message', handleFormSubmission);
    }
    
    function handleFormSubmission(event) {
        // Handle form submission from iframe
        if (event.data && event.data.action === 'formSubmitted') {
            // Form was successfully submitted, switch back to view mode
            setTimeout(() => {
                loadViewForm();
            }, 1000);
        }
    }

    // Handle iframe load errors
    document.getElementById('employeeForm').addEventListener('error', function() {
        const loadingIndicator = document.getElementById('loadingIndicator');
        if (loadingIndicator) {
            loadingIndicator.innerHTML = '<div style="color: #dc3545;">Error loading employee details. Please check the URL and try again.</div>';
        }
    });

    // Handle iframe load timeout
    setTimeout(function() {
        const loadingIndicator = document.getElementById('loadingIndicator');
        if (loadingIndicator && loadingIndicator.style.display !== 'none') {
            loadingIndicator.innerHTML = '<div style="color: #ffc107;">Loading is taking longer than expected. Please wait...</div>';
        }
    }, 5000);

    // Initialize image on page load
    document.addEventListener('DOMContentLoaded', function() {
        console.log("image {{ image }}")
        // Check if image section exists (image was provided via Jinja)
        const imageSection = document.querySelector('.form-image-section');
        if (imageSection) {
            // Image section exists, so image was provided via Jinja
            // The image is already set in the HTML, just ensure it's visible
            const imageElement = document.getElementById('formImage');
            if (imageElement && imageElement.src) {
                imageElement.style.display = 'block';
                console.log('Image loaded from Jinja:', imageElement.src);
            }
        } else {
            console.log('No image section found - image not provided via Jinja');
        }
    });
</script>

{% endblock %}

<!-- Start of sidebar -->
<style>
  /* Sidebar Styles */
  .dashboard-sidebar {
    grid-area: sidebar;
    background-color: #f0f3f6;
    color: #525252;
    overflow-y: hidden;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
  }
  
  .sidebar-content {
    overflow-y: auto;
    height: calc(100% - 120px);
  }
  
  .sidebar-logo {
    padding: 1rem;
    border-bottom: 1px solid #e0e0e0;
    margin-bottom: 0.5rem;
  }
  
  .sidebar-logo img {
    max-width: 100%;
    height: auto;
  }
  
  .sidebar-section {
    margin: 1.5rem 0 0.5rem;
    padding: 0 1rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: #8d8d8d;
    letter-spacing: 0.02rem;
  }
  
  .sidebar-navigation {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  
  .sidebar-nav-item {
    padding: 0.75rem 1rem;
    display: flex;
    align-items: center;
    text-decoration: none;
    color: var(--text-color);
    transition: background-color 0.15s, color 0.15s;
  }
  
  .sidebar-nav-item:hover {
    background-color: #e5e5e5;
  }
  
  .sidebar-nav-item.active {
    color: var(--primary-color);
    background-color: var(--primary-light);
    border-left: 4px solid var(--primary-color);
    padding-left: calc(1rem - 4px); /* Adjust for the border */
  }
  
  .sidebar-nav-item svg {
    margin-right: 0.75rem;
    fill: currentColor;
  }
  
  .sidebar-bottom {
    margin-top: auto;
    padding: 1rem;
    border-top: 1px solid #e0e0e0;
  }
  
  .sidebar-user {
    display: flex;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  
  .user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background-color: var(--primary-light);
    color: var(--primary-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    margin-right: 0.75rem;
  }
  
  .user-info {
    flex: 1;
  }
  
  .user-name {
    font-weight: 600;
    font-size: 0.875rem;
    margin: 0;
  }
  
  .user-role {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin: 0;
  }
  
  .sidebar-logout {
    display: block;
    width: 100%;
    margin-top: 0.5rem;
  }
</style>
